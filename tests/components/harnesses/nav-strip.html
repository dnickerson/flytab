<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="/web/style.css">
    <style>
        body { background: #fff; padding: 0; }
        #mount { width: 100%; }
    </style>
</head>
<body>
    <div id="mount"></div>

    <script>
        // Minimal globals. CockpitConfig.get() is called in _applyFieldVisibility and
        // _showPicker but both are guarded — returning null is fine for the harness.
        const CockpitConfig = {
            raw: {},
            get: () => null,
            patch: () => {},
        };
        const Settings = {};
        const DiagLog  = { log: () => {} };
    </script>
    <!-- nav-strip.js does not import stratux-client.js at runtime;
         it only listens on the EventTarget passed in. No need to load it here. -->
    <script src="/web/cockpit/nav-strip.js"></script>
    <script>
        // Mock Stratux client: plain EventTarget — no WebSocket, no HTTP.
        class MockStratuxClient extends EventTarget {}
        const mockStratux = new MockStratuxClient();

        const strip = new NavStrip(document.getElementById('mount'), mockStratux);
        strip.init();

        window.__harness = {
            sendSituation(sit) {
                mockStratux.dispatchEvent(
                    new CustomEvent('stratux:situation', { detail: sit })
                );
            },
            sendDisconnect() {
                mockStratux.dispatchEvent(new CustomEvent('stratux:disconnect'));
            },
        };
    </script>
</body>
</html>
