<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="/web/style.css">
    <style>
        body { background: #fff; }
        #rp-mount { width: 400px; min-height: 100px; }
    </style>
</head>
<body>
    <div id="rp-mount"></div>

    <script>
        // Globals required by route-planner-panel.js at parse/build time.
        // CockpitConfig.aircraftRaw is accessed in _profileForPower() — no typeof guard.
        const CockpitConfig = {
            raw:        {},
            aircraftRaw: { performance: { power_settings: [], cruise_speed_kt: 140 } },
            get:        () => null,
            patch:      () => {},
        };
        const Settings = { workerBase: 'http://localhost:8090' };
        const DiagLog  = { log: () => {} };
        // wireTap is used extensively in _buildDOM — must be present at init time.
        const wireTap  = (el, fn) => el.addEventListener('click', fn);
        // In-memory TripStore so _saveCurrentTrip() can run; records the last save.
        const TripStore = {
            list: async () => [],
            save: async (trip) => { window.__lastSavedTrip = trip; },
        };
        // planSync is referenced in _showPlanSyncUI — optional, guard with typeof.
        // FlyTabPlanning is attempted in _startBuildPlanner — optional, guard is built in.
    </script>

    <!-- route-planner-panel uses NasrDb only in async IDB lookups (not at init).
         Load the real nasr-db.js so the constructor's DB_NAME is available if needed.
         NasrDb does not open IDB at construction time — safe to include. -->
    <script src="/web/shared/nasr-db.js"></script>
    <script src="/web/cockpit/route-planner-panel.js"></script>

    <script>
        const panelEl = document.getElementById('rp-mount');

        // Test airways used by airway-retention tests.
        // V311: FLO → CRE (Florence VORTAC → Myrtle Beach Intl / Grand Strand)
        const TEST_AIRWAYS = [
            {
                name: 'V311',
                type: 'V',
                waypoints: [
                    { id: 'FLO', name: 'Florence',    lat: 34.185, lon: -79.724, type: 'VORTAC' },
                    { id: 'CRE', name: 'Grand Strand', lat: 33.812, lon: -78.724, type: 'VORTAC' },
                ],
            },
        ];

        // nasrDb: pass a stub that supports listAirways() for airway inference.
        const nasrDb = {
            constructor: { DB_NAME: 'flypi' },
            getAirport: () => Promise.resolve(null),
            getNavaid:  (id) => {
                // Resolve test airway navaids so _pillsToWaypoints can get coords.
                const nav = TEST_AIRWAYS.flatMap(a => a.waypoints).find(w => w.id === id);
                return Promise.resolve(nav ? { lat: nav.lat, lon: nav.lon } : null);
            },
            getFix:    () => Promise.resolve(null),
            getAirway: () => Promise.resolve(null),
            listAirways: () => Promise.resolve(TEST_AIRWAYS),
        };

        const panel = new RoutePlannerPanel(panelEl, nasrDb, null);
        panel.init();

        window.__harness = {
            /** Call open() with a minimal plan stub. Returns a Promise. */
            open(plan) {
                return panel.open(plan || null);
            },
            /** Call close() and report the route array length (should be 0). */
            close() {
                panel.close();
                return panel._route.length;
            },
            /** Return true if the panel's inner DOM has been built. */
            isBuilt() {
                return !!panelEl.querySelector('.rpp-inner');
            },
            /** Return the current route pill array (for assertions). */
            getRoute() {
                return panel._route.map(p => ({ id: p.id, type: p.type }));
            },
            /**
             * Inject a route with airway pills directly (simulates what
             * _resultToPills produces after an A* plan with Victor airways),
             * then render.
             */
            setPlannedRoute(route) {
                panel._route = route;
                panel._render();
            },
            /** Call insertApproach() with a cifp:load-procedure event detail. */
            insertApproach(detail) {
                panel.insertApproach(detail);
            },
            /** Run _saveCurrentTrip(plan) and return the trip passed to TripStore.save. */
            async saveTrip(plan) {
                window.__lastSavedTrip = null;
                await panel._saveCurrentTrip(plan);
                return window.__lastSavedTrip;
            },
            /** Route pills including the airway tag _loadPlan re-applies to fix pills. */
            getRouteWithAirways() {
                return panel._route.map(p => ({ id: p.id, type: p.type, airway: p.airway ?? null }));
            },
            /** Seed the panel's coordinate cache so _pillsToWaypoints resolves pills. */
            setCoords(coords) {
                Object.assign(panel._coords, coords);
            },
            /** Run _updateStats(result) and return the stats bar text. */
            updateStats(result) {
                panel._updateStats(result);
                return panel._statsEl.textContent;
            },
            /** Run _recheckFuelStops() against a stub planner; return the dep/dest it planned. */
            async recheckFuelStops() {
                let planned = null;
                panel._planner = {
                    recomputeLegs: (plan) => { planned = plan; return { ...plan, legs: [], summary: {} }; },
                    insertFuelStops: async () => ({ fuelStopCandidates: [] }),
                };
                await panel._recheckFuelStops();
                return planned && { departure: planned.departure, destination: planned.destination };
            },
            /**
             * Tap Plan against a stub planner whose recomputeLegs returns `legs`.
             * Returns the waypoint ids Plan computed and the warnings it raised.
             */
            async tapPlan({ legs = [], reserveGal = 10 } = {}) {
                let planned = null;
                panel._reserveGal = reserveGal;
                panel._planner = {
                    recomputeLegs: (plan) => {
                        planned = plan.waypoints.map(w => w.id || w.icao);
                        return { ...plan, legs, summary: { fuelRemGal: legs.at(-1)?.fuelRemGal } };
                    },
                };
                await panel._onRecomputeTap();
                return { planned, warnings: panel._windWarnings || [] };
            },
            /** Waypoints _pillsToWaypoints builds from the current pills (id + isDest). */
            async pillsToWaypoints() {
                const wps = await panel._pillsToWaypoints();
                return wps.map(w => ({ id: w.id, isDest: !!w.isDest }));
            },
            /** Type into the DEP input and fire its change handler. */
            setDep(value) {
                const dep = panelEl.querySelectorAll('.rpp-icao-inp')[0];
                dep.value = value;
                dep.dispatchEvent(new Event('change'));
            },
            /** Type an identifier into the Add box and tap Add (default insertion point). */
            addFix(id) {
                panel._addInput.value = id;
                return panel._onAddTap();
            },
            /** Current DEP / DEST input values. */
            inputs() {
                const [dep, dest] = panelEl.querySelectorAll('.rpp-icao-inp');
                return { dep: dep?.value, dest: dest?.value };
            },
            /** Type into the DEST input and fire its change handler. */
            setDest(value) {
                const dest = panelEl.querySelectorAll('.rpp-icao-inp')[1];
                dest.value = value;
                dest.dispatchEvent(new Event('change'));
            },
            /**
             * Extract the route array that _doApply would write to flight_plan.route,
             * packaged as a minimal plan object that open() / _loadPlan() can consume.
             */
            getAppliedPlan(dep, dest, waypoints) {
                return {
                    departure:   dep,
                    destination: dest,
                    waypoints,
                    flight_plan: {
                        departure:   dep,
                        destination: dest,
                        route: panel._route.map(r => r.id),
                        legs:  [],
                    },
                };
            },
        };
    </script>
</body>
</html>
