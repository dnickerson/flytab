<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="/web/style.css">
    <style>
        body { background: #f5f5f5; padding: 16px; }
        #mount { width: 320px; }
    </style>
</head>
<body>
    <div id="mount"></div>

    <script>
        // Minimal globals that engine-panel.js reads at parse/init time.
        // All CockpitConfig accesses are guarded with typeof checks, so a
        // partial stub is sufficient — no wireTap/DiagLog/Capacitor needed.
        const CockpitConfig = {
            raw: {},
            get: () => null,
            aircraft: () => null,
        };
        // engine-panel.js reads fuel on board from the tablet (FuelState.measuredGallons,
        // PR #214), not from the engine frame. A tracked 24.9 gal figure here.
        const FuelState = {
            measuredGallons: () => ({ gallons: 24.9, stale: false }),
        };
    </script>
    <!-- Load engine-panel.js directly — no engine-client.js needed because
         the harness injects a MockEngineClient (plain EventTarget). -->
    <script src="/web/shared/fuel-engine.js"></script>
    <script src="/web/cockpit/engine-panel.js"></script>
    <script>
        // Mock client: just an EventTarget — no WebSocket, no HTTP polling.
        class MockEngineClient extends EventTarget {}
        const mockClient = new MockEngineClient();

        const panel = new EnginePanel(document.getElementById('mount'), mockClient);
        panel.init();

        window.__harness = {
            sendData(frame) {
                mockClient.dispatchEvent(
                    new CustomEvent('engine:data', { detail: frame })
                );
            },
            sendDisconnect() {
                mockClient.dispatchEvent(new CustomEvent('engine:disconnect'));
            },
            sendStale() {
                mockClient.dispatchEvent(
                    new CustomEvent('engine:stale', { detail: { stale: true, ageMs: 6000 } })
                );
            },
        };
    </script>
</body>
</html>
