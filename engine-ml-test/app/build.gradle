apply plugin: 'com.android.application'

android {
    namespace = "app.flywhere.engineml"
    compileSdk = 36

    defaultConfig {
        applicationId "app.flywhere.engineml"
        minSdkVersion 28
        targetSdkVersion 36
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    // Don't compress tflite models
    aaptOptions {
        noCompress "tflite"
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'

    // LiteRT (TFLite successor)
    implementation 'com.google.ai.edge.litert:litert:1.2.0'
    implementation 'com.google.ai.edge.litert:litert-gpu:1.2.0'
    // QNN .so files bundled in jniLibs/arm64-v8a/ — loaded via NNAPI HAL

    // Networking
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.11.0'

    // Charting
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'
}
